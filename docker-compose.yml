services:
  acestep:
    image: mungert/acestep-cuda118:0.0.3
    container_name: acestep
    restart: unless-stopped

    ports:
      - "8080:8080"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
